<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WAVE//V3</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/trivo191919/wallahi-dream-girl@latest/style.css">
    </head>
    <body class="passion-one-bold">
        <div class="video-wrapper">
            <video muted id="video">
                <source src="https://cdn.jsdelivr.net/gh/emanoelqueiroz/persona-3-menu@5427ccb58d7a3617704e16aedaf196b942b88162/videos/bg-video-1.mp4" type="video/mp4">
            </video>
        </div>
        <div class="welcome-wrapper">
           <img src="https://cdn.jsdelivr.net/gh/trivo191919/wallahi-dream-girl@latest/wave.jpg">
           <h2>WAVE//V3</h2>
           <p>Tip: use your up and down arrow keys and enter key</p>
           <p>Made by the Big V Vo </p>
        </div>
        <main class="main-content">
            <div class="money-box">
                <h2 id="access-yes">RANK: 1</h2>
                <div class="label" id="user-label">NAME: Random Kid</div>
                <div>Version 3.4</div>
            </div>
            <div class="menu-wrapper">
                
                <ul class="menu"></ul>

            </div>
            <section class="login-panel" id="login-panel" aria-labelledby="login-title" hidden>
                <form id="login-form">
                    <h2 id="login-title">Login</h2>
                    <label for="login-user">User</label>
                    <input id="login-user" name="user" autocomplete="username" required>
                    <label for="login-pass">Password</label>
                    <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
                    <p class="login-message" id="login-message" role="status"></p>
                    <div class="login-buttons">
                        <button type="submit">Sign in</button>
                        <button type="button" id="login-cancel">Cancel</button>
                    </div>
                </form>
            </section>
            <div class="bottom-actions">
                <div class="description-wrapper">
                    <div class="item-description">Now Playing Threats Of The Ocean Sea</div>
                    <div class="description-label">Wave//</div>
                </div>
                <div class="actions-wrapper">
                    <div><span class="button">↑</span> <span>Up</span></div>
                    <div><span class="button">↓ </span> <span>Down</span></div>
                    <div><span class="button">⟳</span> <span>Go</span></div>

                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/gh/trivo191919/wallahi-dream-girl@latest/script.js">
        </script>
    </body>
</html>
